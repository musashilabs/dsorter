[package]
name = "dsorter"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "A background tool that watches a directory and automatically sorts new files into folders based on their type."
repository = "https://github.com/musashilabs/dsorter"
documentation = "https://docs.rs/dsorter"
readme = "README.md"
keywords = ["daemon", "background-job", "file-sorter", "sorter"]
categories = ["command-line-utilities"]
exclude = [
    ".github/",
    ".githooks/",
    ".config/",
    "Makefile",
    ".clippy.toml",
    "deny.toml",
    "rustfmt.toml",
]


[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
directories = "6.0.0"
dirs = "7.0.0"
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
toml = "1.1.6"
daemonize = "0.5.0"
nix = { version = "0.31.3", features = ["signal"] }
serde_json = "1.0.151"
signal-hook = "0.4.4"
